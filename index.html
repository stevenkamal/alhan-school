<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة الأرشيدياكون حبيب جرجس بشبرا الخيمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07111e;
            --bg-card: #0d1f38;
            --header-bg: #142a4a;
            --purple-primary: #a855f7;
            --text-light: #ffffff;
            --text-muted: #8fa0b5;
            --border-purple: rgba(168, 85, 247, 0.3);
        }

        [data-theme="light"] {
            --bg-dark: #f0f4f8;
            --bg-card: #ffffff;
            --header-bg: #e2e8f0;
            --purple-primary: #7c3aed;
            --text-light: #07111e;
            --text-muted: #64748b;
            --border-purple: rgba(124, 58, 237, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Times New Roman', Times, 'Simplified Arabic', Georgia, serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px;
            line-height: 1.6;
        }

        .main-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--header-bg);
            border: 1px solid var(--border-purple);
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            gap: 15px;
        }

        .header-right { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            flex: 1;
        }

        .header-left { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }

        .logo-circle {
            width: 80px; 
            height: 80px; 
            border-radius: 50%;
            border: 2px solid var(--purple-primary); 
            background-color: #07111e;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            flex-shrink: 0;
        }

        .logo-circle img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .header-titles {
            text-align: right;
        }
        .header-titles h1 { font-size: 20px; color: var(--text-light); margin-bottom: 3px; font-weight: bold; }
        .header-titles .sub-title-1 { font-size: 15px; color: var(--purple-primary); margin-bottom: 2px; font-weight: bold; }
        .header-titles .sub-title-2 { font-size: 13px; color: var(--text-muted); }

        .theme-toggle {
            background: var(--bg-card); 
            border: 1px solid var(--border-purple); 
            color: var(--purple-primary);
            padding: 10px 16px; 
            border-radius: 25px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 14px; 
            font-weight: bold;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.2);
            white-space: nowrap;
        }

        .welcome-screen {
            text-align: center; padding: 60px 20px; background-color: var(--bg-card);
            border: 1px solid var(--border-purple); border-radius: 15px; margin-top: 20px;
        }
        .welcome-screen h2 { color: var(--purple-primary); font-size: 30px; margin-bottom: 25px; font-weight: bold; }

        .main-choices-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px; 
            max-width: 900px; 
            margin: 0 auto; 
        }
        
        .choice-card {
            background: rgba(255, 255, 255, 0.01); border: 2px solid var(--border-purple);
            padding: 40px 20px; border-radius: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .choice-card i { font-size: 30px; color: var(--purple-primary); }
        .choice-card span { font-size: 22px; font-weight: bold; }
        .choice-card:hover { border-color: var(--purple-primary); background: rgba(168, 85, 247, 0.1); }

        .back-btn {
            background: var(--bg-card); border: 1px solid var(--border-purple); color: var(--text-light);
            padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; display: none; align-items: center; gap: 5px; font-size: 16px;
        }
        .back-btn:hover { border-color: var(--purple-primary); color: var(--purple-primary); }

        .back-to-stages-btn {
            display: none;
            background: var(--bg-card); border: 1px solid var(--purple-primary); color: var(--purple-primary);
            padding: 10px 15px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; align-items: center; gap: 8px; font-size: 16px; font-weight: bold;
            width: 100%; justify-content: center;
        }

        .content-screen { display: none; }
        
        .content-layout { 
            display: grid; 
            grid-template-columns: 1fr 3fr; 
            gap: 30px; 
        }

        .stages-sidebar {
            background-color: var(--bg-card); border: 1px solid var(--border-purple);
            border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; height: fit-content;
        }
        .stages-sidebar h3 { font-size: 20px; color: var(--text-light); text-align: center; margin-bottom: 10px; font-weight: bold;}

        .stage-btn {
            background: rgba(255, 255, 255, 0.01); border: 1px solid var(--border-purple); color: var(--text-light);
            padding: 12px 15px; border-radius: 8px; cursor: pointer; text-align: right; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: space-between;
        }
        .stage-btn:hover, .stage-btn.active { background-color: rgba(168, 85, 247, 0.15); border-color: var(--purple-primary); color: var(--purple-primary); box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }

        .content-main-area { display: block; }
        .section-title { color: var(--purple-primary); font-size: 24px; margin-bottom: 20px; border-right: 4px solid var(--purple-primary); padding-right: 10px; font-weight: bold; }

        .term-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .term-btn {
            flex: 1;
            padding: 12px;
            background: var(--bg-card);
            border: 2px solid var(--border-purple);
            color: var(--text-light);
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }

        .term-btn.active, .term-btn:hover {
            border-color: var(--purple-primary);
            background-color: rgba(168, 85, 247, 0.2);
            color: var(--purple-primary);
        }

        .hymns-menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .hymn-menu-tab {
            background-color: var(--bg-card); 
            border: 1px solid var(--border-purple); 
            color: var(--text-light);
            padding: 20px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold;
            display: flex; 
            align-items: center; 
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .hymn-menu-tab:hover { 
            border-color: var(--purple-primary); 
            background-color: rgba(168, 85, 247, 0.15); 
            color: var(--purple-primary); 
            transform: translateY(-2px);
        }

        .hymns-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .hymn-card { background-color: var(--bg-card); border: 1px solid var(--border-purple); border-radius: 12px; padding: 25px; position: relative; }
        .hymn-title { font-size: 22px; color: var(--purple-primary); font-weight: bold; margin-bottom: 5px; }
        .hymn-details { font-size: 16px; color: var(--text-muted); margin-bottom: 15px; }

        .audio-wrapper { background-color: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 10px; margin: 15px 0; }
        audio { width: 100%; height: 35px; display: block; }

        .modal { display: none; position: fixed; z-index: 1000; padding-top: 50px; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow-y: auto; text-align: center; }
        .modal-content { margin: auto; display: block; max-width: 95%; max-height: 85vh; border: 2px solid var(--purple-primary); object-fit: contain; }
        .close-modal { position: absolute; top: 15px; left: 25px; color: #fff; font-size: 40px; cursor: pointer; z-index: 1010; }

        .view-lyrics-btn { background: none; border: 1px solid var(--purple-primary); color: var(--purple-primary); padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; display: inline-flex; align-items: center; gap: 8px; }
        .view-lyrics-btn:hover { background-color: rgba(168, 85, 247, 0.15); }
        
        .back-to-list-btn {
            background: var(--bg-card); border: 1px solid var(--purple-primary); color: var(--purple-primary);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: bold;
        }
        .back-to-list-btn:hover { background-color: rgba(168, 85, 247, 0.15); }

        footer { margin-top: 60px; text-align: center; padding: 20px; border-top: 1px solid var(--border-purple); color: var(--text-muted); font-size: 16px; }

        @media (max-width: 992px) {
            .content-layout { grid-template-columns: 1fr; gap: 20px; }
            .stages-sidebar { width: 100%; }
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            header { flex-direction: column; gap: 15px; text-align: center; padding: 15px; }
            .header-right { flex-direction: column; gap: 10px; text-align: center; }
            .header-titles { text-align: center; }
            .header-left { width: 100%; justify-content: center; gap: 15px; }
            .header-titles h1 { font-size: 17px; }
            .header-titles .sub-title-1 { font-size: 13px; }
            .header-titles .sub-title-2 { font-size: 12px; }
            .welcome-screen { padding: 30px 15px; }
            .welcome-screen h2 { font-size: 22px; }
            .main-choices-grid { grid-template-columns: 1fr; gap: 15px; }
            .choice-card { padding: 25px 15px; }
            .choice-card span { font-size: 18px; }
            
            .content-main-area { display: none; }
            .back-to-stages-btn { display: flex; }
            .hymns-menu-container { grid-template-columns: 1fr; }
            .hymn-menu-tab { font-size: 16px; padding: 15px; justify-content: flex-start; }
            .hymn-card { padding: 15px; }
            .hymn-title { font-size: 18px; }
        }
    </style>
</head>

    <header>
        <!-- الجهة اليمنى: شعار الكنيسة + النصوص -->

                <p class="sub-title-1">مطرانية شبرا الخيمة وكل توابعها</p>
                <p class="sub-title-2">تحت رعاية سيدنا الأنبا مرقس وإشراف آباء الكنيسة</p>
            </div>
        </div>

        <div class="header-left">

            <div class="logo-circle" title="شعار المطرانية">

            </div>
            <button class="theme-toggle" id="modeBtn">
                <i class="fa-solid fa-sun" id="modeIcon"></i> 
                <span id="modeText">الوضع المضيء</span>
            </button>
        </div>
    </header>

    <button class="back-btn" id="backBtn" onclick="history.back()"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</button>

    <div id="homeScreen" class="welcome-screen">
        <h2>المنصة التعليمية للمدرسة</h2>
        <div class="main-choices-grid">
            <div class="choice-card" onclick="openContentScreen('alhan', 'الألحان الكنسية')"><i class="fa-solid fa-cross"></i><span>ألحان الكنيسة</span></div>
            <div class="choice-card" onclick="openContentScreen('taqs', 'الطقس الكنسي')"><i class="fa-solid fa-book-open"></i><span>الطقس الكنسي</span></div>
            <div class="choice-card" onclick="openContentScreen('qebti', 'اللغة القبطية')"><i class="fa-solid fa-gopuram"></i><span>اللغة القبطية</span></div>
        </div>
    </div>

    <div id="contentScreen" class="content-screen">
        <div class="content-layout">
            <div class="stages-sidebar" id="stagesSidebar">
                <h3>المراحل الدراسية</h3>
                <button class="stage-btn active" onclick="switchStage('حضانه')">مرحلة حضانة <i class="fa-solid fa-chevron-left"></i></button>
                <button class="stage-btn" onclick="switchStage('أولى وتانية ابتدائي')">أولى وتانية ابتدائي <i class="fa-solid fa-chevron-left"></i></button>
                <button class="stage-btn" onclick="switchStage('تالته ورابعه')">تالتة ورابعة ابتدائي <i class="fa-solid fa-chevron-left"></i></button>
                <button class="stage-btn" onclick="switchStage('خامسه وسادسه')">الخامس والسادس الابتدائي <i class="fa-solid fa-chevron-left"></i></button>
                <button class="stage-btn" onclick="switchStage('اعدادي')">المرحلة الإعدادية <i class="fa-solid fa-chevron-left"></i></button>
                <button class="stage-btn" onclick="switchStage('ثانوي')">المرحلة الثانوية <i class="fa-solid fa-chevron-left"></i></button>
                <button class="stage-btn" onclick="switchStage('جامعيين وخريجين')">الجامعيين وخريجين <i class="fa-solid fa-chevron-left"></i></button>
            </div>
            
            <div class="content-main-area" id="contentMainArea">
                <button class="back-to-stages-btn" onclick="history.back()"><i class="fa-solid fa-arrow-right"></i> العودة لقائمة المراحل</button>
                
                <div class="section-title"><span id="mainSectionTitle">المنهج</span></div>

                <div class="term-selector" id="termSelector">
                    <button class="term-btn active" id="term1Btn" onclick="switchTerm('term1')">الترم الأول</button>
                    <button class="term-btn" id="term2Btn" onclick="switchTerm('term2')">الترم الثاني</button>
                </div>

                <div class="hymns-menu-container" id="hymnsMenu"></div>
                <div class="hymns-grid" id="cardsGrid"></div>
            </div>
        </div>
    </div>
</div>

<div id="lyricsModal" class="modal">
    <span class="close-modal" onclick="closeLyrics()">&times;</span>
    <img class="modal-content" id="modalImg">
</div>

<footer>
    <p>كنيسة البابا كيرلس السادس والأرشيدياكون حبيب جرجس</p>
</footer>

                    {
                        id: "mord_engil_qiyama_sec",
                        title: "مرد انجيل عيد القيامه المجيد",
                        badge: "فرايحي",
                        details: "مرد انجيل عيد القيامه المجيد - المرحلة الثانوية.",
                        audio: "ثانوي/الحان/ترم تاني/مرد انجيل عيد القيامه المجيد/audio.mp3",
                        hasLyricsImg: true,
                        lyricsImg: "ثانوي/الحان/ترم تاني/مرد انجيل عيد القيامه المجيد/lyrics.png"
                    },
                    {
                        id: "mord_engil_soom_sec",
                        title: "مرد انجيل قداس ايام (الصوم الكبير)",
                        badge: "صيامي",
                        details: "مرد انجيل قداس ايام الصوم الكبير - المرحلة الثانوية.",
                        audio: "ثانوي/الحان/ترم تاني/مرد انجيل قداس ايام (الصوم الكبير)/audio.mp3",
                        hasLyricsImg: true,
                        lyricsImg: "ثانوي/الحان/ترم تاني/مرد انجيل قداس ايام (الصوم الكبير)/lyrics.png"
                    }
                ]
            },
            "جامعيين وخريجين": { term1: [], term2: [] }
        },
        taqs: { 
            "حضانه": "حضانه/طقس/lesson.pdf", 
            "أولى وتانية ابتدائي": "أولى وتانية ابتدائي/طقس/lesson.pdf", 
            "تالته ورابعه": "تالته ورابعه/طقس/lesson.pdf", 
            "خامسه وسادسه": "خامسه وسادسه/طقس/lesson.pdf", 
            "اعدادي": "اعدادي/طقس/lesson.pdf", 
            "ثانوي": "ثانوي/طقس/lesson.pdf", 
            "جامعيين وخريجين": "جامعيين وخريجين/طقس/lesson.pdf" 
        },
        qebti: { 
            "حضانه": "حضانه/قبطي/lesson.pdf", 
            "أولى وتانية ابتدائي": "أولى وتانية ابتدائي/قبطي/lesson.pdf", 
            "تالته ورابعه": "تالته ورابعه/قبطي/lesson.pdf", 
            "خامسه وسادسه": "خامسه وسادسه/قبطي/lesson.pdf", 
            "اعدادي": "اعدادي/قبطي/lesson.pdf", 
            "ثانوي": "ثانوي/قبطي/lesson.pdf", 
            "جامعيين وخريجين": "جامعيين وخريجين/قبطي/lesson.pdf" 
        }
    };

    let currentModule = '', currentStage = 'حضانه', currentTerm = 'term1', currentModuleText = '';

    window.addEventListener('load', () => {
        history.replaceState({ screen: 'home' }, '');
    });

    function navigateTo(stateData) {
        history.pushState(stateData, '');
        renderScreen(stateData);
    }

    function renderScreen(state) {
        if (!state || state.screen === 'home') {
            document.getElementById('homeScreen').style.display = 'block';
            document.getElementById('contentScreen').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
        } 
        else if (state.screen === 'stages') {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('contentScreen').style.display = 'block';
            
            if (window.innerWidth <= 768) {
                document.getElementById('stagesSidebar').style.display = 'flex';
                document.getElementById('contentMainArea').style.display = 'none';
                document.getElementById('backBtn').style.display = 'flex';
            } else {
                document.getElementById('stagesSidebar').style.display = 'flex';
                document.getElementById('contentMainArea').style.display = 'block';
                document.getElementById('backBtn').style.display = 'flex';
            }
        } 
        else if (state.screen === 'hymns') {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('contentScreen').style.display = 'block';
            
            if (window.innerWidth <= 768) {
                document.getElementById('stagesSidebar').style.display = 'none';
                document.getElementById('contentMainArea').style.display = 'block';
                document.getElementById('backBtn').style.display = 'none';
            } else {
                document.getElementById('stagesSidebar').style.display = 'flex';
                document.getElementById('contentMainArea').style.display = 'block';
                document.getElementById('backBtn').style.display = 'flex';
            }
        }
    }

    window.addEventListener('popstate', (event) => {
        if (event.state) {
            renderScreen(event.state);
        } else {
            renderScreen({ screen: 'home' });
        }
    });

    function openContentScreen(m, t) {
        currentModule = m; currentModuleText = t;
        
        const termSelector = document.getElementById('termSelector');
        if (m === 'alhan') {
            termSelector.style.display = 'flex';
        } else {
            termSelector.style.display = 'none';
        }

        loadData();
        navigateTo({ screen: 'stages', module: m, moduleText: t });
    }

    function switchStage(s) {
        const btns = document.querySelectorAll('.stage-btn');
        btns.forEach(b => b.classList.remove('active'));
        
        if (event && event.currentTarget) {
            event.currentTarget.classList.add('active');
        }
        
        currentStage = s; 
        loadData();

        if (window.innerWidth <= 768) {
            navigateTo({ screen: 'hymns', module: currentModule, stage: s });
        }
    }

    function switchTerm(term) {
        currentTerm = term;
        document.getElementById('term1Btn').classList.toggle('active', term === 'term1');
        document.getElementById('term2Btn').classList.toggle('active', term === 'term2');
        loadData();
    }

    function loadData() {
        const menuContainer = document.getElementById('hymnsMenu');
        const grid = document.getElementById('cardsGrid');
        menuContainer.innerHTML = ''; grid.innerHTML = ''; 

        if (currentModule === 'alhan') {
            const termText = currentTerm === 'term1' ? ' - الترم الأول' : ' - الترم الثاني';
            document.getElementById('mainSectionTitle').textContent = `منهج ${currentModuleText} - ${currentStage}${termText}`;
            
            let list = [];
            if (schoolData.alhan[currentStage] && schoolData.alhan[currentStage][currentTerm]) {
                list = schoolData.alhan[currentStage][currentTerm];
            }

            if (list && list.length > 0) {
                menuContainer.style.display = "grid";
                list.forEach((item) => {
                    menuContainer.innerHTML += `
                        <div class="hymn-menu-tab" onclick="displaySingleHymn('${item.id}')">
                            <i class="fa-solid fa-music" style="color: var(--purple-primary);"></i> 
                            <span>${item.title}</span>
                        </div>
                    `;
                });
                grid.innerHTML = '';
            } else {
                menuContainer.style.display = "none";
                grid.innerHTML = `<p style="text-align:center; padding:20px; color:var(--text-muted); font-size:18px;">جاري الرفع قريباً...</p>`;
            }
        } else {
            document.getElementById('mainSectionTitle').textContent = `منهج ${currentModuleText} - ${currentStage}`;
            menuContainer.style.display = "none";
            
            const pdfPath = schoolData[currentModule][currentStage];
            if (pdfPath) {
                grid.innerHTML = `
                    <div class="hymn-card" style="text-align: center; padding: 40px;">
                        <div class="hymn-title" style="margin-bottom: 15px;"><i class="fa-solid fa-file-pdf" style="color: var(--purple-primary);"></i> منهج ${currentModuleText} لمرحلة ${currentStage}</div>
                        <div class="hymn-details" style="margin-bottom: 25px;">اضغط على الزر أدناه لفتح أو تحميل ملف الـ PDF الخاص بالمنهج.</div>
                        <button class="view-lyrics-btn" onclick="window.open('${pdfPath}', '_blank')">
                            <i class="fa-solid fa-file-pdf"></i> فتح ملف المنهج (PDF)
                        </button>
                    </div>
                `;
            } else {
                grid.innerHTML = `<p style="text-align:center; padding:20px; color:var(--text-muted); font-size:18px;">جاري الرفع قريباً...</p>`;
            }
        }
    }

    function displaySingleHymn(hymnId) {
        const menuContainer = document.getElementById('hymnsMenu');
        const grid = document.getElementById('cardsGrid');
        
        menuContainer.style.display = "none";
        grid.innerHTML = ''; 

        let list = schoolData.alhan[currentStage][currentTerm];
        const item = list.find(h => h.id === hymnId);

        if(item) {
            grid.innerHTML = `
                <div>
                    <button class="back-to-list-btn" onclick="loadData()"><i class="fa-solid fa-arrow-right"></i> العودة لقائمة الألحان</button>
                    <div class="hymn-card">
                        <div class="hymn-title">${item.title}</div>
                        <div class="hymn-details">${item.details}</div>
                        <div class="audio-wrapper">
                            <audio controls><source src="${item.audio}" type="audio/mpeg"></audio>
                        </div>
                        ${item.hasLyricsImg ? `<button class="view-lyrics-btn" onclick="openLyrics('${item.lyricsImg}')"><i class="fa-solid fa-image"></i> فتح صورة الكلمات الأصلية</button>` : ''}
                    </div>
                </div>`;
        }
    }

    function openLyrics(s) { document.getElementById('lyricsModal').style.display = "block"; document.getElementById('modalImg').src = s; }
    function closeLyrics() { document.getElementById('lyricsModal').style.display = "none"; }

    const modeBtn = document.getElementById('modeBtn');
    modeBtn.addEventListener('click', () => {
        if (document.body.getAttribute('data-theme') === 'light') {
            document.body.removeAttribute('data-theme');
            document.getElementById('modeText').textContent = 'الوضع المضيء';
            document.getElementById('modeIcon').className = 'fa-solid fa-sun';
        } else {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('modeText').textContent = 'الوضع الداكن';
            document.getElementById('modeIcon').className = 'fa-solid fa-moon';
        }
    });

    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
            document.getElementById('stagesSidebar').style.display = 'flex';
            document.getElementById('contentMainArea').style.display = 'block';
            if (document.getElementById('contentScreen').style.display === 'block') {
                document.getElementById('backBtn').style.display = 'flex';
            }
        }
    });
</script>
</body>
